name: engineering-assistant
services:
  app:
    build: .
    image: engineering-assistant:local
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 60s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8088"
    environment:
      ACCESS_MODE: "${ACCESS_MODE:-local}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
    volumes:
      - type: bind
        source: ${ASSISTANT_DATA_DIR:-./data}
        target: /data
      - type: bind
        source: ${RECORDINGS_DIR:-./data/recordings}
        target: /data/recordings
